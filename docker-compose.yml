services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-draft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-draft}
      POSTGRES_DB: ${POSTGRES_DB:-livedraft}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
